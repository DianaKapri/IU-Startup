<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/favicon-mob.png">
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Новый пароль — ШколаПлан</title>
<link rel="stylesheet" href="/css/styles.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
</head>
<body class="login-page">

<nav class="nav nav--dark" id="nav"><div class="nav__inner">
  <a href="/" class="nav__logo"><svg class="nav__logo-icon" width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="1" y="1" width="8" height="8" rx="1.5" fill="currentColor" opacity=".9"/><rect x="11" y="1" width="8" height="8" rx="1.5" fill="currentColor" opacity=".5"/><rect x="1" y="11" width="8" height="8" rx="1.5" fill="currentColor" opacity=".5"/><rect x="11" y="11" width="8" height="8" rx="1.5" fill="currentColor" opacity=".3"/></svg> ШколаПлан</a>
  <div class="nav__right">
    <a href="/login.html" class="nav__link">← Войти</a>
  </div>
</div></nav>

<main class="auth-wrap"><div class="auth-box">

  <div class="auth-form" id="loadingPanel">
    <div style="text-align:center;padding:32px 0">
      <div style="width:36px;height:36px;border:3px solid rgba(255,255,255,.1);border-top-color:rgba(255,255,255,.5);border-radius:50%;animation:_spin .7s linear infinite;margin:0 auto 16px;"></div>
      <p style="color:#86868b;font-size:.9rem">Проверяем ссылку…</p>
    </div>
  </div>

  <form class="auth-form" id="resetForm" style="display:none">
    <h2 class="auth-form__title">Новый пароль</h2>
    <p style="color:#86868b;font-size:.88rem;line-height:1.55;margin-bottom:20px">Придумайте надёжный пароль — не менее 6 символов.</p>
    <div class="field">
      <label class="field__label" for="newPass">Новый пароль</label>
      <input class="field__input" id="newPass" type="password" placeholder="минимум 6 символов" autocomplete="new-password"/>
    </div>
    <div class="field">
      <label class="field__label" for="newPassConfirm">Повторите пароль</label>
      <input class="field__input" id="newPassConfirm" type="password" placeholder="ещё раз" autocomplete="new-password"/>
    </div>
    <p class="auth-form__err" id="resetErr"></p>
    <button class="btn btn--primary btn--full" type="submit" id="resetBtn">Сохранить пароль</button>
  </form>

  <div class="auth-form" id="successPanel" style="display:none">
    <div style="text-align:center;padding:16px 0 8px">
      <div style="width:56px;height:56px;border-radius:50%;background:rgba(48,209,88,.12);border:1.5px solid #30d158;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:26px;">✓</div>
      <h2 class="auth-form__title" style="margin-bottom:10px">Пароль изменён</h2>
      <p style="color:#86868b;font-size:.9rem;line-height:1.6;margin-bottom:24px">
        Теперь вы можете войти с новым паролем.
      </p>
      <a href="/login.html" class="btn btn--primary btn--full">Войти</a>
    </div>
  </div>

  <div class="auth-form" id="errorPanel" style="display:none">
    <div style="text-align:center;padding:16px 0 8px">
      <div style="width:56px;height:56px;border-radius:50%;background:rgba(255,69,58,.12);border:1.5px solid #ff453a;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:26px;">✕</div>
      <h2 class="auth-form__title" style="margin-bottom:10px">Ссылка недействительна</h2>
      <p style="color:#86868b;font-size:.9rem;line-height:1.6;margin-bottom:24px">
        Ссылка для сброса пароля устарела или уже была использована.<br/>
        Запросите новую ссылку.
      </p>
      <a href="/login.html" class="btn btn--primary btn--full">Запросить снова</a>
    </div>
  </div>

</div></main>

<style>
@keyframes _spin { to { transform: rotate(360deg); } }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/auth.js"></script>
<script>
(function () {
  function show(id) {
    ['loadingPanel','resetForm','successPanel','errorPanel'].forEach(function (p) {
      var el = document.getElementById(p);
      if (el) el.style.display = p === id ? '' : 'none';
    });
  }

  /* Читаем токены прямо из URL-хэша — до любых async-вызовов */
  var hashParams = new URLSearchParams(
    (location.hash || '').replace(/^#/, '')
  );
  var accessToken  = hashParams.get('access_token');
  var refreshToken = hashParams.get('refresh_token');
  var tokenType    = hashParams.get('type');

  /* Supabase также может отправить ?type=recovery в query string */
  var queryParams  = new URLSearchParams(location.search);
  if (!tokenType) tokenType = queryParams.get('type');

  _initSupabase().then(function (sb) {

    if (accessToken && tokenType === 'recovery') {
      /* Устанавливаем сессию из токенов в хэше */
      return sb.auth.setSession({
        access_token:  accessToken,
        refresh_token: refreshToken || '',
      }).then(function (res) {
        if (res.error) { show('errorPanel'); return; }
        show('resetForm');
        document.getElementById('newPass').focus();
      });
    }

    /* Fallback: слушаем событие PASSWORD_RECOVERY */
    var shown = false;
    sb.auth.onAuthStateChange(function (event) {
      if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') && !shown) {
        shown = true;
        show('resetForm');
        document.getElementById('newPass').focus();
      }
    });

    /* Если через 5 с форма так и не открылась — ссылка нерабочая */
    setTimeout(function () {
      if (!shown) show('errorPanel');
    }, 5000);

  }).catch(function () { show('errorPanel'); });

  document.getElementById('resetForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pass1 = document.getElementById('newPass').value;
    var pass2 = document.getElementById('newPassConfirm').value;
    var err   = document.getElementById('resetErr');
    var btn   = document.getElementById('resetBtn');
    err.textContent = '';

    if (pass1.length < 6) { err.textContent = 'Пароль должен содержать не менее 6 символов'; return; }
    if (pass1 !== pass2)  { err.textContent = 'Пароли не совпадают'; return; }

    btn.disabled = true;
    btn.textContent = 'Сохраняем…';

    spSetNewPassword(pass1).then(function (res) {
      btn.disabled = false;
      btn.textContent = 'Сохранить пароль';
      if (res.ok) {
        show('successPanel');
      } else {
        err.textContent = res.error || 'Ошибка сохранения. Запросите ссылку повторно.';
      }
    });
  });
})();
</script>
</body>
</html>
